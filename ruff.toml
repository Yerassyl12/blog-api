line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[lint.isort]
known-first-party = ["apps", "settings"]
section-order = ["future", "standard-library", "third-party", "rest-framework", "django", "first-party", "local-folder"]

[lint.isort.sections]
"rest-framework" = ["rest_framework"]
"django" = ["django"]
